<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Shop - Inscription</title>
    <link rel="stylesheet" href="/css/main.css">
</head>
<body>
    <div id="topbar"></div>

    <main>
        <section class="hero">
            <div class="container">
                <h1>Inscription</h1>

                <div class="container">
                    <form action="/register" method="POST">
                        <div class="form-group mb-3">
                            <label>Nom</label>
                            <input type="text" class="form-control" placeholder="Entrez votre nom" name="firstName">
                        </div>
                        <div class="form-group mb-3">
                            <label>Prénom</label>
                            <input type="text" class="form-control" placeholder="Entrez votre prénom" name="lastName">
                        </div>
                        <div class="form-group mb-3">
                            <label>Nom d'utilisateur</label>
                            <input type="text" class="form-control" placeholder="Entrez un nom d'utilisateur" name="userName">
                        </div>
                        <div class="form-group mb-3">
                            <label>Email</label>
                            <input type="text" class="form-control" placeholder="Adresse email" name="email">
                        </div>
                        <div class="form-group mb-3">
                            <label>Mot de passe</label>
                            <input type="password" class="form-control" placeholder="Entrer mot de passe" name="password">
                        </div>
                        <div class="d-grid mt-3">
                        <button type="submit" class="btn btn-primary form-control">Envoyer</button>
                        </div>
                    </form>
                    </div>

            </div>
        </section>
    </main>

    <footer id="contact" class="footer">
        <div class="container">
            <p>Projet pedagogique - ETML 183 - Camille Rais</p>
        </div>
    </footer>

    <script src="/js/nav.js"></script>
</body>
</html>
