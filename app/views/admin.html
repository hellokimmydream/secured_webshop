<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Shop - Administration</title>
    <link rel="stylesheet" href="/css/main.css">
</head>
<body>
    <div id="topbar"></div>

    <main>
        <section class="hero">
            <div class="container">
                <h1>Administration</h1>
                <p class="hero-text">Gestion des utilisateurs</p>
            </div>
        </section>

        <section class="admin-section">
            <div class="container">
                <h2>Liste des utilisateurs</h2>
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nom</th>
                            <th>Email</th>
                            <th>Rôle</th>
                            <th>Adresse</th>
                        </tr>
                    </thead>
                    <tbody id="user-table-body">
                        <tr><td colspan="5">Chargement...</td></tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <footer id="contact" class="footer">
        <div class="container">
            <p>Projet pedagogique - ETML 183 - Camille Rais</p>
        </div>
    </footer>

    <script src="/js/nav.js"></script>
    <script>
        // le fetch utilise le token
        fetch('/api/admin/users', {
            headers : {
                'Authorization': 'Bearer ' + localStorage.getItem('token')
            }
        })
            .then(r => r.json())
            // mise en place d'une protection xss injection
            .then(users => {
    const tbody = document.getElementById('user-table-body');
    // on vide le tableau
    tbody.innerHTML = '';

    // pour chaque utilisateur on crée une ligne avec createElement
    // textContent echappe automatiquement le HTML donc pas de XSS possible
    users.forEach(u => {
        const tr = document.createElement('tr');

        const tdId = document.createElement('td');
        tdId.textContent = u.id;

        const tdNom = document.createElement('td');
        tdNom.textContent = u.username;

        const tdEmail = document.createElement('td');
        tdEmail.textContent = u.email;

        const tdRole = document.createElement('td');
        const spanRole = document.createElement('span');
        spanRole.className = 'badge-' + u.role;
        spanRole.textContent = u.role;
        tdRole.appendChild(spanRole);

        const tdAdresse = document.createElement('td');
        tdAdresse.textContent = u.address || '-';

        tr.appendChild(tdId);
        tr.appendChild(tdNom);
        tr.appendChild(tdEmail);
        tr.appendChild(tdRole);
        tr.appendChild(tdAdresse);

        tbody.appendChild(tr);
    });
})
            .catch(() => {
                document.getElementById('user-table-body').innerHTML =
                    '<tr><td colspan="5">Erreur lors du chargement</td></tr>';
            });
    </script>
</body>
</html>
